# Local AWS (Floci). `npm run floci:up` starts it, `npm run floci:down` stops it.
# Container is named "floci" so `docker logs floci` works.
services:
  floci:
    image: floci/floci:2.4.0 # pinned: an emulator upgrade should be a deliberate change, not a surprise
    container_name: floci
    ports:
      - "4566:4566" # every AWS service on one port, like LocalStack
    environment:
      # Keep resources across restarts (default is in-memory: a restart wipes everything).
      FLOCI_STORAGE_MODE: "persistent"
      # Step 2: let API Gateway JWT authorizers trust the local Cognito issuer.
      # The flag only trusts literal loopback IPs, so tokens must be issued as http://127.0.0.1:4566/<pool>.
      FLOCI_SECURITY_ALLOW_PRIVATE_JWT_TARGETS: "true"
      FLOCI_BASE_URL: "http://127.0.0.1:4566"
      # Next.js dev server origin (browser calls in later steps).
      FLOCI_SECURITY_EXTRA_CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      # Group the Lambda containers Floci starts under this project in Docker Desktop.
      FLOCI_DOCKER_EXTRA_LABELS_0__KEY: "com.docker.compose.project"
      FLOCI_DOCKER_EXTRA_LABELS_0__VALUE: "aws-teams-ai"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Floci starts each Lambda as a sibling container
      - floci-data:/app/data
volumes:
  floci-data:
